<!DOCTYPE html>
<html>
<head>
  <title>QA & SEO Checker</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Critical QA & SEO</h1>
      <button id="run-qa-btn">▶ Run Checks</button>
    </div>

    <div id="initial-view">
      <p>Click "Run Checks" to analyze the page for the most important QA and SEO issues.</p>
    </div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>Analyzing page...</p>
    </div>

    <div id="error-container" class="hidden">
      <h2>An Error Occurred</h2>
      <p>The script could not be completed. Please try again or check the page for issues.</p>
      <pre id="error-details"></pre>
    </div>

    <div id="results" class="hidden">
      <!-- The streamlined report will be built here -->
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
