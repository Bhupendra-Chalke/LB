<!DOCTYPE html>
<html>
<head>
  <title>Canon QA/SEO Checker</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>QA & SEO Report</h1>
      <button id="run-qa-btn">Run Checks</button>
    </div>
    <div id="loading" class="hidden">
      <p>Running checks, please wait...</p>
    </div>
    <div id="error-container" class="hidden">
      <h2>An Error Occurred</h2>
      <p>The QA script could not be completed. This might be due to a recent change in the website's structure.</p>
      <pre id="error-details"></pre>
    </div>
    <div id="results" class="hidden">
      <div class="tabs">
        <button class="tab-link active" data-tab="qa-results">QA Report</button>
        <button class="tab-link" data-tab="seo-results">SEO Report</button>
      </div>
      <div id="qa-results" class="tab-content active">
        <!-- QA results will be dynamically inserted here -->
      </div>
      <div id="seo-results" class="tab-content">
        <!-- SEO results will be dynamically inserted here -->
      </div>
      <div class="download-buttons">
        <button id="download-json-btn">Download JSON</button>
        <button id="download-csv-btn">Download CSV</button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
